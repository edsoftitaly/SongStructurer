name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v

  build:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ".[build]"
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(python -c 'import songstructurer; print(songstructurer.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/SongStructurer.spec
      - name: Self-test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SongStructurer.exe `
            -ArgumentList '--selftest', 'selftest.json' -Wait -PassThru
          if (Test-Path selftest.json) { Get-Content selftest.json }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\SongStructurer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SongStructurer.exe" | Out-File -Encoding ascii -NoNewline dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SongStructurer-windows
          path: |
            dist/SongStructurer.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SongStructurer-windows
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/SongStructurer.exe dist/SHA256SUMS.txt \
            --title "SongStructurer $GITHUB_REF_NAME" \
            --notes-file <(python3 tools/release_notes.py "$GITHUB_REF_NAME") \
            --verify-tag
